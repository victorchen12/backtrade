# 复制为 configs/profiles/local.yaml 后填写本机路径；该文件不应提交。
paths:
  # 代码根目录；相对路径相对于运行目录。
  project_root: .
  # 运行产物和 HTML 报告目录。
  output_root: ./runs
  future_l2_data_root: ./input
  result_view_root: ./result_view
data:
  # 也可以在命令行用 --market-path/--factor-path 覆盖。
  market_path: ./input/market.parquet
  factor_path: ./input/l1_imbalance.parquet
  product: ag
